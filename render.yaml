services:
  - type: web
    name: echowave-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: USE_MEMORY_DB
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://echowave.vercel.app
      - key: MONGO_URI
        value: mongodb://127.0.0.1:27017/sounddeck
